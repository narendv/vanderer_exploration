run_name: nwm_cdit_b_finetune

# training setup
results_dir: ${repo}/outputs/world_model
train: True
batch_size: 8
num_workers: 12
model: CDiT-B/2
lr: 1e-6

# Resume from a checkpoint
from_checkpoint: ${nwm_logs}/nwm_cdit_b/checkpoints/cdit_b_100000.pth.tar

# normalization for the action space
normalize: True
grad_clip_val: 1.0
context_size: 4

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: -64
  max_dist_cat: 64

# action output params
len_traj_pred: 64

# dataset specific parameters
image_size: 224
datasets:
  carla_town6:
    data_folder: ${data_root}/carla_town6
    train: ${data_splits}/carla_town6/train/ # path to train folder with traj_names.txt
    test: ${data_splits}/carla_town6/test/ # path to test folder with traj_names.txt
    waypoint_spacing: 2
    end_slack: 3 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: False # negative mining from the ViNG paper (Shah et al.)

  carla_town7:
    data_folder: ${data_root}/carla_town7
    train: ${data_splits}/carla_town7/train/ # path to train folder with traj_names.txt
