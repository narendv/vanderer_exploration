project_name: forward_model
run_name: nomad_vae

# training setup
use_wandb: True # set to false if you don't want to log to wandb
train: True
batch_size: 256
eval_batch_size: 32
epochs: 100
gpu_ids: "auto"
num_workers: 4
lr: 1e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: nomad
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: vae
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 8
mha_num_attention_layers: 6
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

# diffusion model params
num_diffusion_iters: 10

# mask 
goal_mask_prob: 1.0

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 3 # 5
alpha: 1e-4


# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# action output params
len_traj_pred: 8
learn_angle: True

# dataset specific parameters
image_size: [224, 224] # width, height
datasets:
  tartan_ground:
    data_folder: ${data_root}/tartan_ground_processed
    train: ${data_splits}/tartan_ground/train/ # path to train folder with traj_names.txt
    test: ${data_splits}/tartan_ground/test/ # path to test folder with traj_names.txt
    end_slack: 1 # because many trajectories end in collisions
    goals_per_obs: 1 # how many goals are sampled per observation
    negative_mining: False # negative mining from the ViNG paper (Shah et al.)

# logging stuff
## =0 turns off
print_log_freq: 1000 # in iterations
image_log_freq: 10000 # in iterations
num_images_log: 4 # number of images to log 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 100 # in iterations
eval_freq: 1 # in epochs